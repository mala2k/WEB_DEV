
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | Malak Portfolio</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <a href="index.html" class="back-link">
        ← Retour à la page d'accueil
    </a>

    <h1 class="form-title">Contactez-moi</h1>

    <p class="form-description">
        Remplissez le formulaire ci-dessous.
    </p>

    <form action="" method="post">

        <div class="form-group">
            <label for="nom">Nom :</label>
            <input type="text" name="nom" id="nom" placeholder="Votre nom" required>
        </div>

        <div class="form-group">
            <label for="email">Email :</label>
            <input type="email" name="email" id="email" placeholder="Votre email" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe :</label>
            <input type="password" name="password" id="password" placeholder="Votre mot de passe" required>
        </div>

        <div class="form-group">
            <label for="tel">Téléphone :</label>
            <input type="tel" name="tel" id="tel" placeholder="+213 ...." required>
        </div>

        <div class="form-group">
            <label>Âge :</label>

            <div class="options">
                <label>
                    <input type="radio" name="age" id="age1" value="20-30" required>
                    Plus de 20 ans
                </label><br>

                <label>
                    <input type="radio" name="age" id="age2" value="plus-30">
                    Plus de 30 ans
                </label>
            </div>
        </div

        <div class="form-group">
            <label>Moyen de contact :</label>

            <div class="options">
                <label>
                    <input type="checkbox" name="contact[]" value="email">
                    Email
                </label><br>

                <label>
                    <input type="checkbox" name="contact[]" value="telephone">
                    Téléphone
                </label><br>
                <label>
                    <input type="checkbox" name="contact[]" value="telephone et email">
                    Téléphone et Email
                </label><br>
            </div>
        </div>

        <div class="form-group">
            <label for="message">Message :</label>
            <textarea name="message" id="message" rows="5" placeholder="Écrivez votre message..." required></textarea>
        </div>

        <div class="form-group">
            <label for="niveau">Sélectionnez votre niveau d'étude :</label>

            <select name="niveau" id="niveau" required>
                <option value="">Choisir un niveau</option>
                <option value="L1">L1</option>
                <option value="L2">L2</option>
                <option value="L3">L3</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            Envoyer
        </button>

    </form>

</body>
</html>
